<svg width="660" height="498" viewBox="0 0 660 498" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="18" width="620" height="62" rx="4" fill="#F4F1E9" stroke="#1A1A1A" stroke-width="1.5" /><text x="40" y="44" font-family="PingFang SC" font-size="13" fill="#3F4A55" letter-spacing="2">原话 · 来自家族群</text><text x="40" y="68" font-family="Songti SC" font-size="20" fill="#1A1A1A">空腹吃荔枝会得荔枝病，严重的会致死</text><line x1="330" y1="80" x2="330" y2="112" stroke="#3F4A55" stroke-width="2" /><path d="M326 106 L330 114 L334 106" fill="none" stroke="#3F4A55" stroke-width="2" /><text x="344" y="104" font-family="PingFang SC" font-size="13" fill="#3F4A55" letter-spacing="1">拆成 3 条可独立验证的线索</text><rect x="20" y="124" width="620" height="96" rx="4" fill="#FFFFFF" stroke="rgba(26,26,26,0.14)" stroke-width="1.5" /><rect x="20" y="124" width="4" height="96" fill="#3F4A55" /><text x="42" y="158" font-family="PingFang SC" font-size="13" fill="#3F4A55">线索 01</text><text x="42" y="186" font-family="Songti SC" font-size="19" fill="#1A1A1A">存在「荔枝病」这种急性低血糖症</text><text x="42" y="208" font-family="PingFang SC" font-size="14" fill="#3F4A55">疾控 / 柳叶刀 / 科普中国 三方一致</text><circle cx="588" cy="172" r="38" fill="rgba(46,107,79,0.08)" stroke="#2E6B4F" stroke-width="4" /><circle cx="588" cy="172" r="32" fill="none" stroke="#2E6B4F" stroke-width="1.5" /><text x="588" y="182" text-anchor="middle" font-family="Songti SC" font-size="26" font-weight="bold" fill="#2E6B4F">属实</text><rect x="20" y="236" width="620" height="96" rx="4" fill="#FFFFFF" stroke="rgba(26,26,26,0.14)" stroke-width="1.5" /><rect x="20" y="236" width="4" height="96" fill="#3F4A55" /><text x="42" y="270" font-family="PingFang SC" font-size="13" fill="#3F4A55">线索 02</text><text x="42" y="298" font-family="Songti SC" font-size="19" fill="#1A1A1A">儿童是高危人群</text><text x="42" y="320" font-family="PingFang SC" font-size="14" fill="#3F4A55">病例集中在 2—10 岁，证据一致</text><circle cx="588" cy="284" r="38" fill="rgba(46,107,79,0.08)" stroke="#2E6B4F" stroke-width="4" /><circle cx="588" cy="284" r="32" fill="none" stroke="#2E6B4F" stroke-width="1.5" /><text x="588" y="294" text-anchor="middle" font-family="Songti SC" font-size="26" font-weight="bold" fill="#2E6B4F">属实</text><rect x="20" y="348" width="620" height="96" rx="4" fill="#FFFFFF" stroke="rgba(26,26,26,0.14)" stroke-width="1.5" /><rect x="20" y="348" width="4" height="96" fill="#A8351A" /><text x="42" y="382" font-family="PingFang SC" font-size="13" fill="#3F4A55">线索 03</text><text x="42" y="410" font-family="Songti SC" font-size="19" fill="#1A1A1A">吃几颗荔枝就会致死</text><text x="42" y="432" font-family="PingFang SC" font-size="14" fill="#3F4A55">删掉了「空腹 + 大量 + 未成熟」三个前提</text><circle cx="588" cy="396" r="38" fill="rgba(168,53,26,0.08)" stroke="#A8351A" stroke-width="4" /><circle cx="588" cy="396" r="32" fill="none" stroke="#A8351A" stroke-width="1.5" /><text x="588" y="406" text-anchor="middle" font-family="Songti SC" font-size="26" font-weight="bold" fill="#A8351A">不实</text><rect x="20" y="460" width="620" height="26" rx="3" fill="rgba(182,105,14,0.10)" /><text x="40" y="479" font-family="PingFang SC" font-size="14" fill="#B6690E">总章：部分属实 · 夸大 —— 判断来自三条线索的加权，不是对整句话的印象</text></svg>