<svg width="430" height="516" viewBox="0 0 540 648" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="532" height="640" rx="6" fill="#F4F1E9" stroke="#1A1A1A" stroke-width="3" /><rect x="28" y="28" width="484" height="592" fill="#FDFCF7" stroke="#1A1A1A" stroke-width="2" /><text x="56" y="86" font-family="Songti SC" font-size="30" font-weight="bold" fill="#1A1A1A">求真社 · 查证结果</text><text x="58" y="112" font-family="PingFang SC" font-size="14" fill="#3F4A55" letter-spacing="2">VERIFACT / VF-1024-0001</text><line x1="56" y1="130" x2="484" y2="130" stroke="#1A1A1A" stroke-width="2" /><text x="56" y="168" font-family="PingFang SC" font-size="15" fill="#A8351A">原话</text><text x="56" y="204" font-family="Songti SC" font-size="23" fill="#1A1A1A">空腹吃荔枝会得荔枝病，</text><text x="56" y="236" font-family="Songti SC" font-size="23" fill="#1A1A1A">严重的会致死</text><text x="56" y="286" font-family="PingFang SC" font-size="15" fill="#A8351A">结论</text><text x="56" y="344" font-family="Songti SC" font-size="52" font-weight="bold" fill="#B6690E">部分属实</text><text x="56" y="394" font-family="PingFang SC" font-size="16" fill="#3F4A55">确实有荔枝病，但被夸大了：</text><text x="56" y="422" font-family="PingFang SC" font-size="16" fill="#3F4A55">需要空腹 + 大量 + 未成熟三个条件叠加，</text><text x="56" y="450" font-family="PingFang SC" font-size="16" fill="#3F4A55">儿童风险最高。吃几颗致死没有依据。</text><circle cx="410" cy="520" r="72" fill="rgba(168,53,26,0.07)" stroke="#A8351A" stroke-width="5" /><circle cx="410" cy="520" r="62" fill="none" stroke="#A8351A" stroke-width="2" /><text x="410" y="510" text-anchor="middle" font-family="Songti SC" font-size="34" font-weight="bold" fill="#A8351A">部分</text><text x="410" y="550" text-anchor="middle" font-family="Songti SC" font-size="34" font-weight="bold" fill="#A8351A">属实</text><text x="56" y="596" font-family="PingFang SC" font-size="12" fill="#3F4A55">证据与来源见卷宗 · 每条结论均可点开原文核对</text></svg>